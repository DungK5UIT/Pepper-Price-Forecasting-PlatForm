# Tests run against an in-memory database so they need no credentials and no
# network. Schema comes from the entities rather than the migrations: the
# migrations are PostgreSQL-specific and are exercised against real PostgreSQL,
# not here.
#
# This is profile-specific on purpose — a plain application.properties on the
# test classpath would shadow the main one instead of overriding parts of it.
app.time-zone=Asia/Ho_Chi_Minh

# A known credential for the tests that exercise the internal endpoint. Not a
# secret: this profile never reaches a real database or a real network.
app.internal-api.username=ml-service
app.internal-api.password=test-only-password

# MlForecastClient needs this to resolve at context startup; nothing in this
# profile makes a real call to the ML service, so the value is unused beyond that.
app.ml-service.token=test-only-token

spring.datasource.url=jdbc:h2:mem:backend;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.forecast.refresh-on-startup=false
app.ingest.run-on-startup=false
