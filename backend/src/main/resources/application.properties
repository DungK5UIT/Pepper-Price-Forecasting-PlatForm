spring.application.name=backend

# Everything time-dependent is anchored here rather than on the host's zone: a
# price belongs to a Vietnamese trading day, and a container defaults to UTC,
# where every hour before 07:00 local still reads as the previous date. Used by
# the Clock bean and by every scheduled job's cron.
app.time-zone=Asia/Ho_Chi_Minh

# Local credentials live in an untracked .env next to the pom (see .env.example).
# Optional, so deployments that inject real environment variables need no file.
spring.config.import=optional:file:.env[.properties]

# Omit null fields (e.g. a forecast point has no "actual") so the JSON matches
# the optional properties the frontend's types declare.
spring.jackson.default-property-inclusion=non_null

# Origins allowed to call the public API. Next.js dev server by default.
app.cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health,info
# Which collection job has gone quiet is the whole point of the check, so the
# per-component detail has to be visible. Nothing secret lives in it — job
# names, timestamps, row counts — but it is one more thing to put behind auth
# when auth exists.
# when-authorized, not always: which collection job has gone quiet is
# operational detail, and /actuator/health is reachable without credentials so
# an uptime check can use it. Authenticate with the internal credential to see
# the breakdown; anonymous callers get the aggregate status only.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=INTERNAL
# STALE outranks UP so a quiet collection job surfaces in the aggregate, and
# maps to 200 rather than 503: the process is healthy, its data is not, and
# restarting it would collect nothing. See IngestionHealthIndicator.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,STALE,UP,UNKNOWN
management.endpoint.health.status.http-mapping.STALE=200

# PostgreSQL, supplied per environment — see .env.example. Supabase's session
# pooler (port 5432) rather than the transaction pooler: this service holds a
# long-lived connection pool and uses prepared statements.
# The single machine credential the ML service uses for /internal/**. No
# default: a blank fallback is how an internal endpoint ends up open, so the
# application refuses to start without one. See .env.example.
app.internal-api.username=${INTERNAL_API_USER}
app.internal-api.password=${INTERNAL_API_PASSWORD}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# The schema is owned by the migrations in db/migration, so Hibernate only
# checks that the entities match it and never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# The target schema already holds the earlier prototype's tables, which this
# service does not own. Baselining at 0 records that starting point without
# claiming those tables, and still runs V1 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Daily collection of the data everything else is derived from (ADR-0005).
# 07:00, so the forecast refresh later the same morning sees today's price.
app.ingest.price.cron=0 0 7 * * *
app.ingest.weather.cron=0 10 7 * * *
# Off by default: a boot should not depend on public websites being reachable.
app.ingest.run-on-startup=false
# How long a job may go without a successful run before /actuator/health says
# so. Daily jobs plus two hours of grace, so one missed morning is visible by
# the next one rather than a day later.
app.ingest.staleness-threshold=PT26H

# The Python ML service (ADR-0002). Forecast refreshes call it; if it is down,
# the last stored run keeps serving.
app.ml-service.base-url=http://localhost:8000
# 08:15 daily, after the morning price collection.
app.forecast.refresh-cron=0 15 8 * * *
# Off by default: a boot should not depend on another service being up.
app.forecast.refresh-on-startup=false
