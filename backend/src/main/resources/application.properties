spring.application.name=backend

# Local credentials live in an untracked .env next to the pom (see .env.example).
# Optional, so deployments that inject real environment variables need no file.
spring.config.import=optional:file:.env[.properties]

# Omit null fields (e.g. a forecast point has no "actual") so the JSON matches
# the optional properties the frontend's types declare.
spring.jackson.default-property-inclusion=non_null

# Origins allowed to call the public API. Next.js dev server by default.
app.cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health,info

# PostgreSQL, supplied per environment — see .env.example. Supabase's session
# pooler (port 5432) rather than the transaction pooler: this service holds a
# long-lived connection pool and uses prepared statements.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# The schema is owned by the migrations in db/migration, so Hibernate only
# checks that the entities match it and never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# The target schema already holds the earlier prototype's tables, which this
# service does not own. Baselining at 0 records that starting point without
# claiming those tables, and still runs V1 onwards.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
