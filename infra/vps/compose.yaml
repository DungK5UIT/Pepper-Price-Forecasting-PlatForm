# Backend + ML service on a small shared VPS (4 GB RAM, also running other work).
# Frontend stays on Vercel. Database stays on Supabase.
#
#   cd infra/vps && docker compose --env-file .env up -d --build
#
# Memory is capped per container so this stack can never starve the rest of
# the machine. Nothing listens on a public port: the VPS has no public IPv4,
# so ngrok dials out and gives the backend a stable public HTTPS URL.

name: giatieuviet

services:
  ml-service:
    build:
      context: ../../ml-service
    environment:
      ML_SERVICE_TOKEN: ${APP_MLSERVICE_TOKEN:?set it in infra/vps/.env}
    mem_limit: 384m
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?set it in infra/vps/.env}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:?set it in infra/vps/.env}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?set it in infra/vps/.env}
      INTERNAL_API_USER: ${INTERNAL_API_USER:?set it in infra/vps/.env}
      INTERNAL_API_PASSWORD: ${INTERNAL_API_PASSWORD:?set it in infra/vps/.env}
      APP_MLSERVICE_TOKEN: ${APP_MLSERVICE_TOKEN:?set it in infra/vps/.env}
      APP_MLSERVICE_BASEURL: http://ml-service:8000
      APP_CORS_ALLOWED_ORIGINS: https://giatieuviet.vercel.app
      JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -Xss512k
    mem_limit: 640m
    depends_on:
      - ml-service
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3-alpine
    command: ["http", "--url=${NGROK_DOMAIN:?set it in infra/vps/.env}", "backend:8080"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set it in infra/vps/.env}
    mem_limit: 64m
    depends_on:
      - backend
    restart: unless-stopped
