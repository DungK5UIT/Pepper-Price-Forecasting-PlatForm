# Backend on Fly.io. Deploy from the repository root:
#   flyctl deploy --config infra/fly/backend.toml
# See infra/fly/README.md for the one-time setup (account, secrets, first
# deploy) and docs/adr/0007-hosted-deployment.md for why this shape.

app = "giatieuviet-backend"
primary_region = "sin" # Singapore — same region as the Supabase project
                        # (aws-0-ap-southeast-1), so the connection-pooled
                        # queries this service does constantly don't take a
                        # cross-region hop on every request.

[build]
  dockerfile = "../../backend/Dockerfile"
  context = "../../backend"

[env]
  # Non-secret only. SUPABASE_DB_URL/USER/PASSWORD and INTERNAL_API_USER/
  # PASSWORD are set once via `fly secrets set` — see infra/fly/README.md —
  # never here, since this file is committed.
  #
  # The ml-service address is fixed: Fly's private network resolves any app
  # in the same org at <app-name>.internal, whether or not that app has a
  # public service — see ml-service.toml.
  APP_MLSERVICE_BASEURL = "http://giatieuviet-ml-service.internal:8000"
  # Placeholder until the Vercel project exists and its real domain is
  # known — infra/fly/README.md has the one follow-up command to fix this.
  APP_CORS_ALLOWED_ORIGINS = "https://giatieuviet.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true # ADR-0006: Basic Auth on /internal/** must not travel
                      # over plain HTTP. This is what makes that true.

  # app.ingest.price.cron / app.ingest.weather.cron / app.forecast.refresh-cron
  # run in-process via @Scheduled. A machine that autostops silently stops
  # the daily ingestion and forecast refresh until something happens to wake
  # it — always-on is a correctness requirement here, not a cost preference.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/actuator/health"
    protocol = "http"
    timeout = "5s"
    # STALE (stale ingestion data, not a process failure) maps to HTTP 200
    # in application.properties — a plain "expect 200" check is safe and
    # won't flap on a quiet collection job. Same reasoning as the Dockerfile's
    # deliberate lack of a Docker HEALTHCHECK (see ADR-0005).

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  # Starting point to stay inside Fly's Hobby allowance (3x
  # shared-cpu-1x-256mb included). Spring Boot + JPA + Flyway + Security in
  # 256MB is tight — JAVA_OPTS already sizes the heap from the container
  # limit (-XX:MaxRAMPercentage=75), but watch `fly logs -a giatieuviet-backend`
  # for OOM kills after the first deploy. If it OOMs, bump this to 512mb
  # (outside the free allowance, roughly $2-3/mo) rather than living with
  # restarts — see ADR-0007's Consequences.
