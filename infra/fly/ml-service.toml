# ML service on Fly.io — deliberately private. Deploy from the repository
# root:
#   flyctl deploy --config infra/fly/ml-service.toml
# See infra/fly/README.md and docs/adr/0007-hosted-deployment.md.

app = "giatieuviet-ml-service"
primary_region = "sin"

[build]
  dockerfile = "../../ml-service/Dockerfile"
  context = "../../ml-service"

# No [http_service] / [[services]] block, on purpose. Fly only allocates a
# public *.fly.dev hostname and edge routing when a services block exists;
# without one, this app gets no public entry point at all — reachable only
# on Fly's private network, at giatieuviet-ml-service.internal:8000, from
# other apps in the same Fly org. Reproduces infra/docker/compose.yaml's
# "not published at all" for this service (see that file's header comment)
# and is a decision recorded in ADR-0007, not an oversight.
#
# Consequence: there is no Fly-managed HTTP health check either — that's an
# http_service feature. This service's health is observed through the
# backend's own graceful degradation (it keeps serving the last stored
# forecast if the ml-service is unreachable) and through the post-deploy
# smoke test in infra/fly/README.md, not an automated probe.
#
# Consequence: auto_stop_machines / min_machines_running don't apply either
# — autostop is edge-proxy behavior, and there is no proxy here. Once
# `flyctl deploy` starts the machine it just stays running, which happens
# to be exactly the "no cold start for a demo" behavior wanted, as a side
# effect of the privacy decision rather than a setting chosen for it.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  # No JVM here — a single joblib model loaded once at startup, served by
  # uvicorn. 256MB is comfortable, unlike the backend's.
